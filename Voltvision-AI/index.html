<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltVision AI - Circuit Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">⚡ VoltVision AI</div>
        <nav>
            <a href="#analyzer">Analyzer</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main class="main-container">
        <section id="analyzer" class="analyzer-card">
            <h2>Upload Circuit Image</h2>
            <p class="subtitle">Arduino • ESP32 • Breadboard • PCB • Prototype</p>

            <div class="upload-area">
                <input type="file" id="imageInput" accept="image/*">
                <label for="imageInput" class="upload-label">
                    📷 Choose Image
                </label>
            </div>

            <div class="preview-container">
                <img id="imagePreview" alt="Circuit Preview">
            </div>

            <button id="analyzeBtn" class="btn-submit">🔎 Analyze Circuit & Fix Code</button>
        </section>

        <section class="results-container">
            <h3>Analysis Results</h3>
            <div id="result" class="result-box">
                Upload an image and click 'Analyze Circuit' to get detailed component detection, connection checks, error fixes, and code generation.
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
